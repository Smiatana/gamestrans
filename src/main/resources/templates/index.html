<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Галоўная', ~{::main})}">
<body>
  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>Бібліятэка гульняў</h1>
        <p>Дзяліцеся беларускімі перакладамі для любімых гульняў.</p>
      </div>
      <a th:if="${currentUser}" th:href="@{/translations/new}" class="btn btn--primary">
        <i data-lucide="plus-circle"></i> Дадаць пераклад
      </a>
    </header>

    <div class="search-form-card">
      <form th:action="@{/}" method="get" id="filterForm">
        <div class="search-bar-row">
          <div class="input-icon-group">
            <input type="text" name="search" th:value="${search}" 
                   class="form-input-main" placeholder="Назва гульні, распрацоўшчык..." autocomplete="off">
          </div>
          <button type="submit" class="btn btn--primary btn--lg">
            <i data-lucide="search"></i>
            Шукаць
          </button>
        </div>

        <div class="genre-toggle-row" th:if="${!#lists.isEmpty(allGenres)}">
          <button type="button" id="genreToggleBtn" class="btn btn--outline btn--sm">Паказаць жанры</button>
          <span class="text-muted">Жанры схаваны па змаўчанні. Націсніце, каб паказаць.</span>
        </div>

        <div class="genre-filter collapsed" th:if="${!#lists.isEmpty(allGenres)}">
          <span class="genre-filter__label">Жанры:</span>
          <div id="genreInputs" style="display:none">
            <input th:each="gid : ${selectedGenres}" type="hidden" name="genres" th:value="${gid}">
          </div>
          <button th:each="genre : ${allGenres}" 
                  type="button" 
                  class="tag-selectable"
                  th:classappend="${selectedGenres.contains(genre.id)} ? 'active'"
                  th:text="${genre.name}" 
                  th:attr="data-id=${genre.id}" 
                  onclick="toggleGenre(this)"></button>
        </div>
      </form>
    </div>

    <div class="games-grid">
      <div th:each="game : ${games}" class="game-card">
        <a th:href="@{/g/{id}(id=${game.title})}">
          <div class="game-card__image-box">
            <img th:if="${game.coverUrl}" th:src="${game.coverUrl}" alt="Вокладка">
          </div>
          <div class="game-card__body">
            <h2 th:text="${game.title}"></h2>
            <div class="game-card__dev" th:text="${game.developer}"></div>
            
            <div class="game-card__tags">
              <span th:each="g : ${game.genres}" class="mini-tag" th:text="${g.name}"></span>
              <span th:if="${hasNonDraftMap[game.id] == false}" class="mini-tag" style="color: var(--clr-warning);">Чарнавік</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </main>

  <script>
    function toggleGenre(btn) {
      const id = btn.dataset.id;
      const container = document.getElementById('genreInputs');
      const existing = container.querySelector(`input[value="${id}"]`);
      if (existing) {
        existing.remove();
        btn.classList.remove('active');
      } else {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'genres';
        input.value = id;
        container.appendChild(input);
        btn.classList.add('active');
      }
      document.getElementById('filterForm').submit();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const genreToggleBtn = document.getElementById('genreToggleBtn');
      const genreFilter = document.querySelector('.genre-filter');
      if (genreToggleBtn && genreFilter) {
        genreToggleBtn.addEventListener('click', () => {
          const expanded = genreFilter.classList.toggle('expanded');
          genreFilter.classList.toggle('collapsed', !expanded);
          genreToggleBtn.textContent = expanded ? 'Схаваць жанры' : 'Паказаць жанры';
          if (expanded) {
            genreFilter.style.display = 'flex';
          } else {
            genreFilter.style.display = 'none';
          }
        });
      }
    });
  </script>
</body>
</html>
