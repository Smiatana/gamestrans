<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Галоўная', ~{::main})}">
<body>
  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>GamesTrans</h1>
        <p>Дзяліцеся беларускімі перакладамі для любімых гульняў.</p>
      </div>
      <a th:if="${currentUser}" th:href="@{/translations/new}" class="btn btn--primary">
        <i data-lucide="plus-circle"></i> Дадаць пераклад
      </a>
    </header>

    <div class="search-form-card">
      <form th:action="@{/}" method="get" id="filterForm">
        <div class="search-bar-row">
          <div class="input-icon-group">
            <input type="text" name="search" th:value="${search}" 
                   class="form-input-main" placeholder="Назва гульні, распрацоўшчык..." autocomplete="off">
          </div>
          <button type="submit" class="btn btn--primary btn--lg">
            <i data-lucide="search"></i>
            Шукаць
          </button>
        </div>
      </form>
      
      <div th:if="${!#lists.isEmpty(allGenres)}" class="genre-section">
        <div class="genre-toggle-row">
          <button type="button" id="genreToggleBtn" class="btn btn--outline btn--sm" onclick="toggleGenres()">Паказаць жанры</button>
          <span class="text-muted">Жанры схаваны па змаўчанні. Націсніце, каб паказаць.</span>
        </div>

        <div id="genreFilter" class="genre-filter" style="display: none;">
          <span class="genre-filter__label">Жанры:</span>
          <div id="genreInputs">
            <input th:each="gid : ${selectedGenres}" type="hidden" name="genres" th:value="${gid}" form="filterForm">
          </div>
          <button th:each="genre : ${allGenres}" 
                  type="button" 
                  class="tag-selectable"
                  th:classappend="${selectedGenres.contains(genre.id)} ? 'active'"
                  th:text="${genre.name}" 
                  th:attr="data-id=${genre.id}" 
                  onclick="toggleGenre(this)"></button>
        </div>
      </div>
      <br>

      <div class="games-grid">
      <div th:each="game : ${games}" class="game-card">
        <a th:href="@{/g/{id}(id=${game.title})}">
          <div class="game-card__image-box">
            <img th:if="${game.coverUrl}" th:src="${game.coverUrl}" alt="Вокладка">
          </div>
          <div class="game-card__body">
            <h2 th:text="${game.title}"></h2>
            <div class="game-card__dev" th:text="${game.developer}"></div>
            
            <div class="game-card__tags">
              <span th:each="g : ${game.genres}" class="mini-tag" th:text="${g.name}"></span>
              <span th:if="${hasNonDraftMap[game.id] == false}" class="mini-tag" style="color: var(--clr-warning);">Чарнавік</span>
            </div>
          </div>
        </a>
      </div>
    </div>

    <script>
      function toggleGenres() {
        const filter = document.getElementById('genreFilter');
        const btn = document.getElementById('genreToggleBtn');
        if (filter.style.display === 'none') {
          filter.style.display = 'flex';
          btn.textContent = 'Схаваць жанры';
        } else {
          filter.style.display = 'none';
          btn.textContent = 'Паказаць жанры';
        }
      }

      function toggleGenre(btn) {
        const id = btn.dataset.id;
        const container = document.getElementById('genreInputs');
        const existing = container.querySelector(`input[value="${id}"]`);
        if (existing) {
          existing.remove();
          btn.classList.remove('active');
        } else {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'genres';
          input.value = id;
          input.setAttribute('form', 'filterForm');
          container.appendChild(input);
          btn.classList.add('active');
        }
        document.getElementById('filterForm').submit();
      }

      (function() {
        const selected = document.querySelectorAll('#genreInputs input[name="genres"]').length;
        if (selected > 0) {
          const filter = document.getElementById('genreFilter');
          const btn = document.getElementById('genreToggleBtn');
          if (filter && btn) {
            filter.style.display = 'flex';
            btn.textContent = 'Схаваць жанры';
          }
        }
      })();
    </script>
</body>
</html>
