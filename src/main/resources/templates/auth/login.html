<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Уваход', ~{::main})}">
<body>
<main class="main-content">
<div style="max-width: 460px; margin-inline: auto;">
<div class="form-card">
<h1 style="text-align: center; margin-bottom: 2rem;">Уваход</h1>
<div th:if="${param.error}" class="alert alert--danger">Няправільны email або пароль</div>
            <div th:if="${param.confirmed}" class="alert alert--success">Email пацверджаны</div>
            <div th:if="${param.passwordReset}" class="alert alert--success">Пароль паспяхова зменены</div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="username" class="form-input" autofocus required>
                </div>
                <div class="form-group">
                    <label>
                        Пароль
                        <a th:href="@{/forgot-password}" style="float: right; font-size: 0.8rem; color: var(--clr-primary);">Забылі пароль?</a>
                    </label>
                    <input type="password" name="password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn--primary" style="width: 100%; height: 50px; margin-top: 1rem;">Увайсці</button>
            </form>
            
            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem;">
               <p>Няма акаўнта? <a th:href="@{/register}" style="color: var(--clr-primary); font-weight: 600;">Зарэгістравацца</a></p>
            </div>

            <div style="margin-top: 1rem; position: relative; text-align: center;">
                <span style="background: var(--clr-surface); padding: 0 10px; font-size: 0.8rem; color: var(--clr-text-dim); z-index: 1;">АБО</span>
                <hr style="position: absolute; top: 50%; width: 100%; border: none; border-top: 1px solid var(--clr-border); margin: 0; z-index: -1;">
            </div>

            <a href="/oauth2/authorization/google" class="btn btn--outline" style="width: 100%; margin-top: 1.5rem;">
                <img src="https://developers.google.com/identity/images/g-logo.png" style="width: 18px;">
                Google
            </a>
        </div>
    </div>
</main>
</body>
</html>
