<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Забылі пароль', ~{::main})}">

<body>
    <main>
        <div class="auth-page">
            <div class="auth-card">
                <h1>Аднавіць пароль</h1>

                <div th:if="${sent}" class="alert alert--success">
                    Калі акаўнт з такім email існуе, мы адправілі спасылку для скіду пароля.
                    Праверце пошту (і папку «Спам»).
                </div>

                <th:block th:unless="${sent}">
                    <p class="text-muted text-sm" style="margin-bottom:1rem;">
                        Увядзіце email вашага акаўнта. Мы адправім спасылку для ўстаноўкі новага пароля.
                    </p>
                    <form th:action="@{/forgot-password}" method="post">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-input" required autofocus
                                placeholder="you@example.com">
                        </div>
                        <button type="submit" class="btn btn--primary" style="width:100%;">
                            Адправіць спасылку
                        </button>
                    </form>
                </th:block>

                <p style="margin-top:1rem;">
                    <a th:href="@{/login}">← Вярнуцца да ўваходу</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
