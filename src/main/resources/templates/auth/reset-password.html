<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Новы пароль', ~{::main})}">

<body>
    <main>
        <div class="auth-page">
            <div class="auth-card">
                <h1>Новы пароль</h1>

                <div th:if="${error}" class="alert alert--danger" th:text="${error}"></div>

                <!-- Token invalid / expired state -->
                <th:block th:if="${error != null and token == null}">
                    <p><a th:href="@{/forgot-password}">Запытаць новую спасылку</a></p>
                </th:block>

                <!-- Valid token: show the form -->
                <th:block th:if="${token != null}">
                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">

                        <div class="form-group">
                            <label for="newPassword">Новы пароль</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-input" required
                                minlength="6" autofocus>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Паўтарыць пароль</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                                required minlength="6">
                        </div>
                        <button type="submit" class="btn btn--primary" style="width:100%;">
                            Захаваць пароль
                        </button>
                    </form>
                </th:block>

                <p style="margin-top:1rem;">
                    <a th:href="@{/login}">← Вярнуцца да ўваходу</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
