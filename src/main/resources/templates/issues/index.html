<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Праблемы', ~{::main})}">
<body>
    <main class="main-content">
        <header class="page-header">
            <div>
                <a th:href="@{/g/{g}/t/{t}(g=${translation.game.title},t=${translation.title})}" style="text-decoration: none;">
                    <p class="text-muted" th:text="${translation.title}"></p>
                </a>
                <h1>Праблемы</h1>
            </div>
        </header>

        <div class="card" th:if="${currentUser != null}" style="padding: 0; overflow: hidden;">
            <button type="button"
                id="toggleFormBtn"
                class="btn btn--outline"
                onclick="toggleForm()">
                <span style="display: flex; align-items: center; gap: 0.5rem;">
                    <i data-lucide="message-circle"></i>
                    <span>Паведаміць аб праблеме</span>
                </span>
                <i data-lucide="chevron-down" id="toggleIcon" style="transition: transform 0.3s ease;"></i>
            </button>
            <div id="collapsibleForm" style="display: none;">
                <div style="padding: 1.5rem;">
                    <form th:action="@{/g/{g}/t/{t}/issues(g=${translation.game.title},t=${translation.title})}"
                        th:object="${issueRequest}" method="post">
                        <div class="form-group">
                            <label>Назва</label>
                            <input type="text" th:field="*{title}" class="form-input">
                            <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                        </div>
                        <div class="form-group">
                            <label>Апісанне</label>
                            <textarea th:field="*{description}" class="form-input" rows="4"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Назва рэліза (неабавязкова)</label>
                            <input type="text" th:field="*{releaseTitle}" class="form-input">
                        </div>
                        <button type="submit" class="btn btn--primary">Адправіць</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="issue-list" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem;">
            <div th:each="issue : ${issues}" class="card issue-item">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                    <div>
                        <span class="badge"
                            th:classappend="${issue.status == 'solved'} ? 'badge--success' : 'badge--draft'"
                            th:text="${issue.status == 'solved'} ? 'Вырашана' : 'Не вырашана'"></span>
                        <strong style="margin-left: 0.75rem;" th:text="${issue.title}"></strong>
                    </div>
                    <div class="btn-group" style="justify-content: flex-end;">
                        <form th:if="${isMember}"
                            th:action="@{/g/{g}/t/{t}/issues/{i}/status(g=${translation.game.title},t=${translation.title},i=${issue.id})}"
                            method="post" style="display:inline;">
                            <input type="hidden" name="_method" value="PATCH">
                            <input type="hidden" name="status"
                                th:value="${issue.status == 'solved'} ? 'unsolved' : 'solved'">
                            <button type="submit" class="btn btn--outline btn--sm"
                                th:text="${issue.status == 'solved'} ? 'Адкрыць' : 'Вырашыць'"></button>
                        </form>
                        <div th:if="${currentUser != null and currentUser.id == issue.author.id}">
                            <a
                            th:href="@{/g/{g}/t/{t}/issues/{i}/edit(g=${translation.game.title},t=${translation.title},i=${issue.id})}"
                            class="btn btn--outline btn--sm">Рэдагаваць</a>
                        </div>
                        <form th:if="${currentUser != null and (currentUser.id == issue.author.id or isMember)}"
                            th:action="@{/g/{g}/t/{t}/issues/{i}(g=${translation.game.title},t=${translation.title},i=${issue.id})}"
                            method="post" style="display:inline;">
                            <input type="hidden" name="_method" value="DELETE">
                            <button type="submit" class="btn btn--danger btn--sm">Выдаліць</button>
                        </form>
                    </div>
                </div>
                <p class="rich-content" th:text="${issue.description}"></p>
                <p class="text-muted text-sm" th:if="${issue.releaseTitle != null}">
                    Рэліз: <span th:text="${issue.releaseTitle}"></span>
                </p>
                <p class="text-muted text-sm">
                    <a th:href="@{/u/{u}(u=${issue.author.username})}" th:text="${issue.author.username}"></a>
                    · <span th:text="${#temporals.format(issue.createdAt, 'dd.MM.yyyy')}"></span>
                </p>
            </div>
        </div>

    <script>
        function toggleForm() {
            const form = document.getElementById('collapsibleForm');
            const icon = document.getElementById('toggleIcon');

            if (form.style.display === 'none' || form.style.display === '') {
                form.style.display = 'block';

                if (icon) {
                    icon.style.transform = 'rotate(180deg)';
                }

                localStorage.setItem('issueFormExpanded', 'true');
            } else {
                form.style.display = 'none';

                if (icon) {
                    icon.style.transform = 'rotate(0deg)';
                }

                localStorage.setItem('issueFormExpanded', 'false');
            }
        }

        (function () {
            const form = document.getElementById('collapsibleForm');
            const icon = document.getElementById('toggleIcon');
            const isExpanded = localStorage.getItem('issueFormExpanded') === 'true';

            if (!form) return;

            if (isExpanded) {
                form.style.display = 'block';

                if (icon) {
                    icon.style.transform = 'rotate(180deg)';
                }
            } else {
                form.style.display = 'none';

                if (icon) {
                    icon.style.transform = 'rotate(0deg)';
                }
            }
        })();
    </script>
    </main>
</body>
</html>
