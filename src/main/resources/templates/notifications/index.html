<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Апавяшчэнні', ~{::main})}">

<body>
    <main>
        <div class="page-header">
            <h1>Апавяшчэнні</h1>
        </div>

        <div class="card" th:if="${#lists.isEmpty(notifications)}">
            <p class="text-muted">Апавяшчэнняў пакуль няма</p>
        </div>

        <div class="notification-list">
            <div th:each="notification : ${notifications}" class="notification-item card"
                th:classappend="${!notification.read} ? 'notification-item--unread' : ''">

                <div class="notification-item__body">

                    <th:block th:if="${notification.type == 'member_request'}" th:with="p=${notification.payloadMap}">
                        <div th:if="${p.get('status') != 'accepted'}">
                            <p>
                                <a class="text-bold"
                                    th:href="@{/u/{u}(u=${notification.payloadMap.get('fromUsername')})}"
                                    th:text="${notification.payloadMap.get('fromUsername')}"></a>
                                запрашае вас далучыцца да перакладу
                                <strong th:text="${notification.payloadMap.get('translationTitle')}"></strong>
                                гульні
                                <strong th:text="${notification.payloadMap.get('gameTitle')}"></strong>
                            </p>

                            <div class="notification-item__actions">
                                <form method="post"
                                    th:action="@{/member-requests/{id}/accept(id=${notification.payloadMap.get('requestId')})}">
                                    <button class="btn btn--primary btn--sm">Прыняць</button>
                                </form>

                                <form method="post"
                                    th:action="@{/member-requests/{id}/reject(id=${notification.payloadMap.get('requestId')})}">
                                    <button class="btn btn--outline btn--sm">Адхіліць</button>
                                </form>
                            </div>
                        </div>
                    </th:block>

                    <th:block th:if="${notification.type == 'request_accepted'}">
                        <p>
                            <a class="text-bold" th:href="@{/u/{u}(u=${notification.payloadMap.get('username')})}"
                                th:text="${notification.payloadMap.get('username')}"></a>
                            прыняў(ла) запрашэнне далучыцца да перакладу
                            <strong th:text="${notification.payloadMap.get('translationTitle')}"></strong>
                        </p>
                    </th:block>

                    <th:block th:if="${notification.type == 'request_rejected'}">
                        <p>
                            <a class="text-bold" th:href="@{/u/{u}(u=${notification.payloadMap.get('username')})}"
                                th:text="${notification.payloadMap.get('username')}"></a>
                            адхіліў(ла) запрашэнне далучыцца да перакладу
                            <strong th:text="${notification.payloadMap.get('translationTitle')}"></strong>
                        </p>
                    </th:block>

                    <th:block th:if="${notification.type == 'kicked'}">
                        <p>
                            Вас выключылі з перакладу
                            <strong th:text="${notification.payloadMap.get('translationTitle')}"></strong>
                            гульні
                            <strong th:text="${notification.payloadMap.get('gameTitle')}"></strong>
                        </p>
                    </th:block>

                </div>

                <div class="notification-item__meta">
                    <span class="text-muted text-sm"
                        th:text="${#temporals.format(notification.createdAt, 'dd.MM.yyyy HH:mm')}"></span>

                    <form th:if="${!notification.read}" method="post"
                        th:action="@{/notifications/{id}/read(id=${notification.id})}">
                        <button class="btn btn--outline btn--sm">Прачытана</button>
                    </form>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
