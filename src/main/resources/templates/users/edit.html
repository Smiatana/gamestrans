<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: html('Рэдагаванне карыстальніка', ~{::main})}">

<body>
    <main>
        <div class="page-header">
            <h1>Рэдагаванне профілю</h1>
        </div>
        <form th:action="@{/u/{name}/edit(name=${user.username})}" th:object="${editProfileRequest}" method="post"
            enctype="multipart/form-data" class="form-card">

            <section class="form-section">
                <div class="form-group">
                    <label>Фота профілю</label>
                    <div class="avatar-crop-container">
                        <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" id="currentAvatar"
                            class="cover-preview">
                        <input type="file" id="avatarInput" accept="image/*" class="form-input">
                        <div id="cropperWrapper" style="display:none; max-width: 400px; margin-top: 1rem;">
                            <img id="cropperImage" style="max-width: 100%;">
                            <button type="button" id="cropBtn" class="btn btn--primary btn--sm"
                                style="margin-top: 0.5rem;">
                                Абрэзаць
                            </button>
                        </div>
                        <input type="hidden" name="avatarCropped" id="avatarCropped">
                        <small class="text-muted">Пакіньце пустым, каб не мяняць фота</small>
                    </div>
                </div>

                <div class="form-group">
                    <label>Імя</label>
                    <input type="text" th:field="*{username}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>

                <div class="form-group">
                    <label>Пра сябе</label>
                    <div th:replace="~{fragments/editor :: richEditor('bio', ${user.bio})}"></div>
                </div>
            </section>

            <div class="form-actions">
                <a th:href="@{/u/{name}(name=${user.username})}" class="btn btn--outline">Адмяніць</a>
                <button type="submit" class="btn btn--primary">Захаваць</button>
            </div>
        </form>

        <div class="danger-zone">
            <h2>Небяспечная зона</h2>

            <label class="text-bold">Змяніць пароль</label>
            <form th:action="@{/u/{u}/changepassword(u=${user.username})}" th:object="${changePasswordRequest}"
                method="post">
                <div class="form-group">
                    <label>Стары пароль</label>
                    <input type="password" th:field="*{oldPassword}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('oldPassword')}"
                        th:errors="*{oldPassword}"></span>
                </div>
                <div class="form-group">
                    <label>Новы пароль</label>
                    <input type="password" th:field="*{newPassword}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('newPassword')}"
                        th:errors="*{newPassword}"></span>
                </div>
                <span class="form-error" th:if="${passwordError}" th:text="${passwordError}"></span>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Змяніць пароль</button>
                </div>
            </form>

            <label class="text-bold">Выйсці з уліковага запісу</label>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn--danger" onclick="return confirm('Вы ўпэўнены?')">Выйсці з
                    уліковага запісу</button>
            </form>

            <label class="text-bold">Замарозіць уліковы запіс</label>
            <form th:action="@{/u/{u}/freeze(u=${user.username})}" method="post">
                <button type="submit" class="btn btn--danger">Замарозіць акаўнт</button>
            </form>

            <label class="text-bold">Выдаліць уліковы запіс</label>
            <form th:action="@{/u/{u}/delete(u=${user.username})}" method="post">
                <button type="submit" class="btn btn--danger" onclick="return confirm('Вы ўпэўнены?')">Выдаліць
                    уліковы запіс</button>
            </form>
        </div>


        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
        <script>
            let cropper;
            const avatarInput = document.getElementById('avatarInput');
            const cropperImage = document.getElementById('cropperImage');
            const cropperWrapper = document.getElementById('cropperWrapper');
            const cropBtn = document.getElementById('cropBtn');
            const avatarCropped = document.getElementById('avatarCropped');

            avatarInput.addEventListener('change', function () {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (e) {
                    cropperImage.src = e.target.result;
                    cropperWrapper.style.display = 'block';
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(cropperImage, {
                        aspectRatio: 1,
                        viewMode: 1,
                        movable: true,
                        zoomable: true,
                        scalable: false,
                    });
                };
                reader.readAsDataURL(file);
            });

            cropBtn.addEventListener('click', function () {
                if (!cropper) return;
                const canvas = cropper.getCroppedCanvas({ width: 256, height: 256 });
                avatarCropped.value = canvas.toDataURL('image/jpeg', 0.9);

                let preview = document.getElementById('currentAvatar');
                if (!preview) {
                    preview = document.createElement('img');
                    preview.id = 'currentAvatar';
                    preview.className = 'cover-preview';
                    document.querySelector('.avatar-crop-container').prepend(preview);
                }
                preview.src = avatarCropped.value;
                cropperWrapper.style.display = 'none';
                avatarInput.value = '';
            });
        </script>
    </main>
</body>

</html>
