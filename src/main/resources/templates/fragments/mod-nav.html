<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="nav(active)">
<aside class="mod-sidebar">
  <button class="mod-sidebar__toggle" onclick="this.closest('.mod-sidebar').classList.toggle('mod-sidebar--open')" aria-label="Меню мадэрацыі">
    <span>☰</span> Меню
  </button>
  <div class="mod-sidebar__body">
    <div class="mod-sidebar__group">
      <p class="mod-sidebar__title">Мадэрацыя</p>
      <a href="/mod" class="mod-sidebar__link">Панэль</a>
      <a href="/mod/releases" class="mod-sidebar__link">Рэлізы на разглядзе</a>
      <a href="/mod/reports" class="mod-sidebar__link">Скаргі</a>
    </div>
    <div class="mod-sidebar__group">
      <p class="mod-sidebar__title">Змест</p>
      <a href="/mod/users" class="mod-sidebar__link">Карыстальнікі</a>
      <a href="/mod/content/games" class="mod-sidebar__link">Гульні</a>
      <a href="/mod/content/translations" class="mod-sidebar__link">Пераклады</a>
      <a href="/mod/content/releases" class="mod-sidebar__link">Усе рэлізы</a>
      <a href="/mod/content/comments" class="mod-sidebar__link">Каментарыі</a>
      <a href="/mod/content/issues" class="mod-sidebar__link">Праблемы</a>
      <a href="/mod/logs" class="mod-sidebar__link">Дзеянні</a>
    </div>
    <div class="mod-sidebar__group" th:if="${currentUser != null and currentUser.role == 'admin'}">
      <p class="mod-sidebar__title">Адміністраванне</p>
      <a href="/admin/moderators" class="mod-sidebar__link">Мадэратары</a>
      <a href="/admin/settings" class="mod-sidebar__link">Налады</a>
    </div>
  </div>
</aside>

<script>
  function openModPreview(source) {
    const card = source.closest('.mod-item');
    if (!card) return;
    const id = card.dataset.id;
    const type = card.dataset.type;
    if (id && type) {
      fetch(`/mod/api/item/${type}/${id}`)
        .then(response => response.json())
        .then(data => {
          const modal = document.getElementById('modPreviewModal');
          const content = modal.querySelector('.modal__content');
          content.innerHTML = generateModalContent(type, data);
          modal.classList.add('active');
          lucide.createIcons();
        })
        .catch(() => {
          const preview = card.querySelector('.mod-item__preview');
          if (preview) {
            const modal = document.getElementById('modPreviewModal');
            modal.querySelector('.modal__content').innerHTML = preview.innerHTML;
            modal.classList.add('active');
            lucide.createIcons();
          }
        });
    } else {
      const preview = card.querySelector('.mod-item__preview');
      if (preview) {
        const modal = document.getElementById('modPreviewModal');
        modal.querySelector('.modal__content').innerHTML = preview.innerHTML;
        modal.classList.add('active');
        lucide.createIcons();
      }
    }
  }

  function getModPreviewLabel(type, key) {
    const labels = {
      game: {
        title: 'Назва',
        developer: 'Студыя',
        releaseYear: 'Год',
        genres: 'Жанры',
        description: 'Апісанне',
        createdBy: 'Аўтар',
        createdAt: 'Створана',
        coverUrl: 'Вокладка',
        backgroundUrl: 'Фон',
        deleted: 'Схавана',
      },
      translation: {
        title: 'Назва',
        game: 'Гульня',
        description: 'Апісанне',
        status: 'Статус',
        createdBy: 'Аўтар',
        createdAt: 'Створана',
        deleted: 'Схавана',
      },
      release: {
        title: 'Назва',
        translation: 'Пераклад',
        game: 'Гульня',
        description: 'Апісанне',
        fileUrl: 'Файл',
        status: 'Статус',
        createdBy: 'Аўтар',
        createdAt: 'Створана',
        deleted: 'Схавана',
      },
      comment: {
        body: 'Тэкст',
        translation: 'Пераклад',
        game: 'Гульня',
        author: 'Аўтар',
        createdAt: 'Створана',
      },
      issue: {
        title: 'Назва',
        description: 'Апісанне',
        releaseTitle: 'Выпуск',
        status: 'Статус',
        translation: 'Пераклад',
        game: 'Гульня',
        author: 'Аўтар',
        createdAt: 'Створана',
      },
      report: {
        targetType: 'Тып аб’екта',
        targetId: 'ID аб’екта',
        reason: 'Прычына',
        status: 'Статус',
        moderatorNote: 'Нататка модэратара',
        author: 'Аўтар',
        createdAt: 'Створана',
        resolvedAt: 'Вырашана',
      },
    };
    return (labels[type] && labels[type][key]) || key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
  }

  function getModPreviewTypeLabel(type) {
    return {
      game: 'Гульня',
      translation: 'Пераклад',
      release: 'Рэліз',
      comment: 'Каментар',
      issue: 'Праблема',
      report: 'Скарга',
    }[type] || type.charAt(0).toUpperCase() + type.slice(1);
  }

  function generateModalContent(type, data) {
    let html = `<h3>${getModPreviewTypeLabel(type)}</h3>`;
    for (const [key, value] of Object.entries(data)) {
      if (value != null) {
        const label = getModPreviewLabel(type, key);
        if (key === 'coverUrl' || key === 'backgroundUrl') {
          html += `<p><strong>${label}:</strong></p><img src="${value}" alt="${label}" class="mod-item__preview-image" />`;
        } else if (key === 'genres' && Array.isArray(value)) {
          html += `<p><strong>${label}:</strong> ${value.map(g => `<span class="badge badge--light">${g}</span>`).join(' ')}</p>`;
        } else if (key === 'createdAt' || key === 'resolvedAt') {
          html += `<p><strong>${label}:</strong> ${new Date(value).toLocaleString('be-BY')}</p>`;
        } else if (key === 'deleted') {
          if (value) {
            html += `<p class="badge badge--danger">${label}</p>`;
          }
        } else {
          html += `<p><strong>${label}:</strong> ${value}</p>`;
        }
      }
    }
    return html;
  }

  function openModDialog(source, selector) {
    const card = source.closest ? source.closest('.mod-item') : null;
    if (!card) return;
    const dialog = card.querySelector(selector);
    if (!dialog) return;
    const modal = document.getElementById('modPreviewModal');
    modal.querySelector('.modal__content').innerHTML = dialog.innerHTML;
    modal.classList.add('active');
    lucide.createIcons();
  }

  function closeModPreview() {
    document.getElementById('modPreviewModal').classList.remove('active');
  }

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeModPreview();
    }
  });
</script>
</th:block>
</body>
</html>
