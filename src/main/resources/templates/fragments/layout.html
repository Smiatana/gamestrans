<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="html(title, content)" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' — GamesTrans'"></title>

  <!-- Professional Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" th:href="@{/css/main.css}">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar__container">
      <a th:href="@{/}" class="navbar__logo">
        <i data-lucide="tv-minimal-play"></i>
        <span>GamesTrans</span>
      </a>

      <div class="navbar__links">
        <th:block th:if="${#authorization.expression('isAuthenticated()')}">
          <th:block th:if="${currentUser != null and (currentUser.role == 'moderator' or currentUser.role == 'admin')}">
            <a th:href="@{/mod}" class="nav-icon-link" title="Мадэрацыя">
              <i data-lucide="shield"></i>
            </a>
          </th:block>
          <th:block th:if="${currentUser != null and currentUser.role == 'admin'}">
            <a th:href="@{/admin/settings}" class="nav-icon-link" title="Адмін панэль">
              <i data-lucide="settings"></i>
            </a>
          </th:block>
          <a th:href="@{/notifications}" class="nav-icon-link" title="Апавяшчэнні">
            <i data-lucide="bell"></i>
            <span class="nav-badge" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}"></span>
          </a>
          <a th:href="@{/u/{u}(u=${currentUser.username})}" class="nav-user-pill" title="Профіль">
            <i data-lucide="user"></i>
            <span th:text="${currentUser.username}"></span>
          </a>
        </th:block>
        
        <th:block th:unless="${#authorization.expression('isAuthenticated()')}">
          <a th:href="@{/login}" class="btn btn--ghost">Увайсці</a>
          <a th:href="@{/register}" class="btn btn--primary btn--sm">Рэгістрацыя</a>
        </th:block>

        <button id="themeToggle" class="btn btn--ghost" style="padding: 8px;">
          <i data-lucide="sun"></i>
        </button>
      </div>
    </div>
  </nav>

  <main th:replace="${content}"></main>

  <div id="modPreviewModal" class="modal" onclick="if(event.target === this) closeModPreview()">
    <div class="modal__backdrop"></div>
    <div class="modal__box">
      <button type="button" class="btn btn--ghost btn--sm" style="position:absolute; top:1rem; right:1rem;" onclick="closeModPreview()" aria-label="Закрыць">
        <i data-lucide="x"></i>
      </button>
      <div class="modal__content"></div>
    </div>
  </div>

  <footer class="main-content" style="padding-block: 40px; border-top: 1px solid var(--clr-border); text-align: center; color: var(--clr-text-dim);">
    <div th:utext="${appSettings != null ? appSettings.footerContent : '&copy; 2025 GamesTrans'}"></div>
  </footer>

  <script>
    lucide.createIcons();
    
    function openModPreview(source) {
      const card = source.closest('.mod-item');
      if (!card) return;
      const id = card.dataset.id;
      const type = card.dataset.type;
      if (id && type) {
        // Fetch dynamic data
        fetch(`/mod/api/item/${type}/${id}`)
          .then(response => response.json())
          .then(data => {
            const modal = document.getElementById('modPreviewModal');
            const content = modal.querySelector('.modal__content');
            content.innerHTML = generateModalContent(type, data);
            modal.classList.add('active');
            lucide.createIcons();
          })
          .catch(error => {
            console.error('Error fetching item details:', error);
            // Fallback to static preview
            const preview = card.querySelector('.mod-item__preview');
            if (preview) {
              const modal = document.getElementById('modPreviewModal');
              modal.querySelector('.modal__content').innerHTML = preview.innerHTML;
              modal.classList.add('active');
              lucide.createIcons();
            }
          });
      } else {
        // Fallback to static
        const preview = card.querySelector('.mod-item__preview');
        if (preview) {
          const modal = document.getElementById('modPreviewModal');
          modal.querySelector('.modal__content').innerHTML = preview.innerHTML;
          modal.classList.add('active');
          lucide.createIcons();
        }
      }
    }

    function getModPreviewLabel(type, key) {
      const labels = {
        game: {
          title: 'Назва',
          developer: 'Студыя',
          releaseYear: 'Год',
          genres: 'Жанры',
          description: 'Апісанне',
          createdBy: 'Аўтар',
          createdAt: 'Створана',
          coverUrl: 'Вокладка',
          backgroundUrl: 'Фон',
          deleted: 'Схавана',
        },
        translation: {
          title: 'Назва',
          game: 'Гульня',
          description: 'Апісанне',
          status: 'Статус',
          createdBy: 'Аўтар',
          createdAt: 'Створана',
          deleted: 'Схавана',
        },
        release: {
          title: 'Назва',
          translation: 'Пераклад',
          game: 'Гульня',
          description: 'Апісанне',
          fileUrl: 'Файл',
          status: 'Статус',
          createdBy: 'Аўтар',
          createdAt: 'Створана',
          deleted: 'Схавана',
        },
        comment: {
          body: 'Тэкст',
          translation: 'Пераклад',
          game: 'Гульня',
          author: 'Аўтар',
          createdAt: 'Створана',
        },
        issue: {
          title: 'Назва',
          description: 'Апісанне',
          releaseTitle: 'Выпуск',
          status: 'Статус',
          translation: 'Пераклад',
          game: 'Гульня',
          author: 'Аўтар',
          createdAt: 'Створана',
        },
        report: {
          targetType: 'Тып аб’екта',
          targetId: 'ID аб’екта',
          reason: 'Прычына',
          status: 'Статус',
          moderatorNote: 'Нататка модэратара',
          author: 'Аўтар',
          createdAt: 'Створана',
          resolvedAt: 'Вырашана',
        },
      };
      return (labels[type] && labels[type][key]) || key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
    }

    function getModPreviewTypeLabel(type) {
      return {
        game: 'Гульня',
        translation: 'Пераклад',
        release: 'Рэліз',
        comment: 'Каментар',
        issue: 'Праблема',
        report: 'Скарга',
      }[type] || type.charAt(0).toUpperCase() + type.slice(1);
    }

    function generateModalContent(type, data) {
      let html = `<h3>${getModPreviewTypeLabel(type)}</h3>`;
      for (const [key, value] of Object.entries(data)) {
        if (value != null) {
          const label = getModPreviewLabel(type, key);
          if (key === 'coverUrl' || key === 'backgroundUrl') {
            html += `<p><strong>${label}:</strong></p><img src="${value}" alt="${label}" class="mod-item__preview-image" />`;
          } else if (key === 'genres' && Array.isArray(value)) {
            html += `<p><strong>${label}:</strong> ${value.map(g => `<span class="badge badge--light">${g}</span>`).join(' ')}</p>`;
          } else if (key === 'createdAt' || key === 'resolvedAt') {
            html += `<p><strong>${label}:</strong> ${new Date(value).toLocaleString('be-BY')}</p>`;
          } else if (key === 'deleted') {
            if (value) {
              html += `<p class="badge badge--danger">${label}</p>`;
            }
          } else {
            html += `<p><strong>${label}:</strong> ${value}</p>`;
          }
        }
      }
      return html;
    }

    function openModDialog(source, selector) {
      const card = source.closest ? source.closest('.mod-item') : null;
      if (!card) return;
      const dialog = card.querySelector(selector);
      if (!dialog) return;
      const modal = document.getElementById('modPreviewModal');
      modal.querySelector('.modal__content').innerHTML = dialog.innerHTML;
      modal.classList.add('active');
      lucide.createIcons();
    }

    function closeModPreview() {
      document.getElementById('modPreviewModal').classList.remove('active');
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModPreview();
      }
    });

    // Simple Theme Toggle
    const btn = document.getElementById('themeToggle');
    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
      btn.innerHTML = `<i data-lucide="${target === 'dark' ? 'sun' : 'moon'}"></i>`;
      lucide.createIcons();
    });

    if(localStorage.getItem('theme') === 'light') {
       document.documentElement.setAttribute('data-theme', 'light');
       btn.innerHTML = `<i data-lucide="moon"></i>`;
       lucide.createIcons();
    }
  </script>
</body>
</html>
