<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Пераклады — мадэрацыя', ~{::main})}">

<body>
    <main>
        <div class="mod-layout">
            <div th:replace="~{fragments/mod-nav :: nav('translations')}"></div>
            <div class="mod-content">
                <div class="page-header">
                    <h1>Усе пераклады</h1>
                </div>
                <div class="mod-list">
                    <div th:each="t : ${translations}" class="card mod-item" th:data-id="${t.id}" th:data-type="'translation'">
                        <div class="mod-item__info">
                            <div class="text-sm text-muted" th:text="${t.game.title}"></div>
                            <div class="text-bold" th:text="${t.title}"></div>
                            <div class="text-sm text-muted">
                                <span class="badge"
                                    th:classappend="${t.status == 'published'} ? ' badge--success' : (${t.status == 'on_review'} ? ' badge--review' : (${t.status == 'deleted'} ? ' badge--danger' : ' badge--draft'))">
                                    <th:block th:switch="${t.status}">
                                        <span th:case="'published'">Апублікаваны</span>
                                        <span th:case="'on_review'">На разглядзе</span>
                                        <span th:case="'draft'">Чарнавік</span>
                                        <span th:case="'deleted'">Выдалены</span>
                                        <span th:case="*" th:text="${t.status}"></span>
                                    </th:block>
                                </span>
                                Аўтар: <a th:href="@{/u/{u}(u=${t.createdBy.username})}"
                                    th:text="${t.createdBy.username}"></a>
                                · <span th:text="${#temporals.format(t.createdAt, 'dd.MM.yyyy')}"></span>
                            </div>
                        </div>
                        <div class="mod-item__preview">
                            <h3 th:text="${t.title}"></h3>
                            <p class="text-sm text-muted" th:text="${t.game.title}"></p>
                            <p><strong>Аўтар:</strong> <a th:href="@{/u/{u}(u=${t.createdBy.username})}" th:text="${t.createdBy.username}"></a></p>
                            <p><strong>Статус:</strong>
                                <th:block th:switch="${t.status}">
                                    <span th:case="'published'">Апублікаваны</span>
                                    <span th:case="'on_review'">На разглядзе</span>
                                    <span th:case="'draft'">Чарнавік</span>
                                    <span th:case="'deleted'">Выдалены</span>
                                    <span th:case="*" th:text="${t.status}"></span>
                                </th:block>
                            </p>
                            <p><strong>Створана:</strong> <span th:text="${#temporals.format(t.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
                            <div th:if="${t.description}">
                                <p><strong>Апісанне:</strong></p>
                                <p th:utext="${t.description}"></p>
                            </div>
                        </div>
                        <div class="mod-item__actions">
                            <button type="button" class="btn btn--outline btn--icon" title="Папярэдні прагляд" onclick="openModPreview(this)">
                                <i data-lucide="eye"></i>
                            </button>
                            <a th:href="@{/g/{g}/t/{t}(g=${t.game.title},t=${t.title})}"
                                class="btn btn--outline btn--icon" title="Адкрыць старонку" target="_blank">
                                <i data-lucide="external-link"></i>
                            </a>
                            <form th:if="${t.deletedAt == null}" th:action="@{/mod/content/translations/{id}/delete(id=${t.id})}" method="post">
                                <button type="submit" class="btn btn--danger btn--icon" title="Выдаліць">
                                    <i data-lucide="trash-2"></i>
                                </button>
                            </form>
                            <form th:if="${t.deletedAt != null}" th:action="@{/mod/content/translations/{id}/restore(id=${t.id})}" method="post">
                                <button type="submit" class="btn btn--success btn--icon" title="Аднавіць">
                                    <i data-lucide="rotate-ccw"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="pagination" th:if="${totalPages > 1}">
                    <a th:if="${currentPage > 0}" th:href="@{/mod/content/translations(page=${currentPage - 1})}"
                        class="btn btn--outline">← Назад</a>
                    <span class="text-muted" th:text="${currentPage + 1} + ' / ' + ${totalPages}"></span>
                    <a th:if="${currentPage + 1 < totalPages}"
                        th:href="@{/mod/content/translations(page=${currentPage + 1})}" class="btn btn--outline">Далей
                        →</a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
