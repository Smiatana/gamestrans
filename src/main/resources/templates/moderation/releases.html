<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Рэлізы на разглядзе', ~{::main})}">

<body>
    <main>
        <div class="mod-layout">
            <div th:replace="~{fragments/mod-nav :: nav('releases')}"></div>
            <div class="mod-content">
                <div class="page-header">
                    <h1>Рэлізы на разглядзе</h1>
                </div>

                <div th:if="${#lists.isEmpty(releases)}" class="card">
                    <p class="text-muted">Усе рэлізы разгледжаны <i data-lucide="party-popper"></i></p>
                </div>

                <div class="mod-list" th:unless="${#lists.isEmpty(releases)}">
                    <div th:each="release : ${releases}" class="card mod-item" th:data-id="${release.id}" th:data-type="'release'">
                        <div class="mod-item__info">
                            <div class="text-sm text-muted" th:text="${release.translation.game.title}"></div>
                            <div class="text-bold" th:text="${release.translation.title}"></div>
                            <div>
                                <strong th:text="${release.title}"></strong>
                                <span class="badge badge--review">На разглядзе</span>
                            </div>
                            <div class="text-sm text-muted">
                                Аўтар:
                                <a th:href="@{/u/{u}(u=${release.createdBy.username})}"
                                    th:text="${release.createdBy.username}"></a>
                                · <span th:text="${#temporals.format(release.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                            </div>
                            <div th:if="${release.fileUrl}" class="mod-item__file">
                                <a th:href="${release.fileUrl}" target="_blank" class="btn btn--outline btn--icon" title="Файл / спасылка">
                                    <i data-lucide="download"></i>
                                </a>
                                <a th:if="${release.fileUrl.startsWith('/uploads/')}"
                                    th:href="'https://www.virustotal.com/gui/url/' + ${#strings.replace(release.fileUrl, '/', '-') }"
                                    target="_blank" class="btn btn--outline btn--icon" title="VirusTotal">
                                    <i data-lucide="shield"></i>
                                </a>
                            </div>
                        </div>

                        <div class="mod-item__preview">
                            <h3 th:text="${release.title}"></h3>
                            <p class="text-sm text-muted" th:text="${release.translation.game.title} + ' / ' + ${release.translation.title}"></p>
                            <p><strong>Аўтар:</strong> <a th:href="@{/u/{u}(u=${release.createdBy.username})}" th:text="${release.createdBy.username}"></a></p>
                            <p><strong>Статус:</strong>
                                <th:block th:switch="${release.status}">
                                    <span th:case="'published'">Апублікаваны</span>
                                    <span th:case="'on_review'">На разглядзе</span>
                                    <span th:case="'draft'">Чарнавік</span>
                                    <span th:case="'deleted'">Выдалены</span>
                                    <span th:case="*" th:text="${release.status}"></span>
                                </th:block>
                            </p>
                            <p><strong>Створана:</strong> <span th:text="${#temporals.format(release.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
                            <div th:if="${release.description}">
                                <p><strong>Апісанне:</strong></p>
                                <p th:utext="${release.description}"></p>
                            </div>
                            <div th:if="${release.fileUrl}">
                                <a th:href="${release.fileUrl}" target="_blank" class="btn btn--outline btn--icon" title="Спампаваць файл">
                                    <i data-lucide="download"></i>
                                </a>
                            </div>
                        </div>
                        <div class="mod-item__approve-modal">
                            <h3>Пацвердзіць рэліз</h3>
                            <form th:action="@{/mod/releases/{id}/approve(id=${release.id})}" method="post">
                                <div class="form-group">
                                    <label>Нататка мадэратара (неабавязкова)</label>
                                    <input type="text" name="note" class="form-input" placeholder="Нататка для журнала">
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn--outline" onclick="closeModPreview()">Адмяніць</button>
                                    <button type="submit" class="btn btn--success">Пацвердзіць</button>
                                </div>
                            </form>
                        </div>
                        <div class="mod-item__reject-modal">
                            <h3>Адхіліць рэліз</h3>
                            <form th:action="@{/mod/releases/{id}/reject(id=${release.id})}" method="post">
                                <div class="form-group">
                                    <label>Нататка мадэратара</label>
                                    <textarea name="note" class="form-input" rows="3" placeholder="Прычына адхілення (неабавязкова)"></textarea>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn--outline" onclick="closeModPreview()">Адмяніць</button>
                                    <button type="submit" class="btn btn--danger">Адхіліць</button>
                                </div>
                            </form>
                        </div>
                        <div class="mod-item__actions">
                            <button type="button" class="btn btn--outline btn--icon" title="Папярэдні прагляд" onclick="openModPreview(this)">
                                <i data-lucide="eye"></i>
                            </button>
                            <a th:href="@{/g/{g}/t/{t}/r/{r}(g=${release.translation.game.title},t=${release.translation.title},r=${release.title})}"
                                class="btn btn--outline btn--icon" title="Адкрыць старонку" target="_blank">
                                <i data-lucide="external-link"></i>
                            </a>
                            <a th:if="${release.fileUrl}" th:href="${release.fileUrl}" target="_blank" class="btn btn--outline btn--icon" title="Спампаваць файл">
                                <i data-lucide="download"></i>
                            </a>
                            <button type="button" class="btn btn--success btn--icon" title="Ухваліць" onclick="openModDialog(this, '.mod-item__approve-modal')">
                                <i data-lucide="check"></i>
                            </button>
                            <button type="button" class="btn btn--danger btn--icon" title="Адхіліць" onclick="openModDialog(this, '.mod-item__reject-modal')">
                                <i data-lucide="x"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pagination" th:if="${totalPages > 1}">
                    <a th:if="${currentPage > 0}" th:href="@{/mod/releases(page=${currentPage - 1})}"
                        class="btn btn--outline">← Назад</a>
                    <span class="text-muted" th:text="${currentPage + 1} + ' / ' + ${totalPages}"></span>
                    <a th:if="${currentPage + 1 < totalPages}" th:href="@{/mod/releases(page=${currentPage + 1})}"
                        class="btn btn--outline">Далей →</a>
                </div>
            </div>
        </div>

    </main>
</body>

</html>
