<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Карыстальнікі', ~{::main})}">

<body>
    <main>
        <div class="mod-layout">
            <div th:replace="~{fragments/mod-nav :: nav('users')}"></div>
            <div class="mod-content">
                <div class="page-header">
                    <h1>Карыстальнікі</h1>
                </div>

                <div class="mod-list">
                    <div th:each="user : ${users}" class="card mod-item">
                        <div class="mod-item__info">
                            <div>
                                <a th:href="@{/u/{u}(u=${user.username})}" class="text-bold"
                                    th:text="${user.username}"></a>
                                <span class="badge" th:text="${user.role}"></span>
                                <span class="badge"
                                    th:classappend="${user.status == 'banned'} ? ' badge--danger' : (${user.status == 'active'} ? ' badge--success' : '')"
                                    th:text="${user.status}"></span>
                            </div>
                            <div class="text-sm text-muted" th:text="${user.email}"></div>
                            <div th:if="${user.status == 'banned' and user.banReason != null}"
                                class="text-sm text-muted">
                                Заблакаваны: <span th:text="${user.banReason}"></span>
                                <span th:if="${user.bannedUntil != null}">
                                    да <span th:text="${#temporals.format(user.bannedUntil, 'dd.MM.yyyy')}"></span>
                                </span>
                                <span th:unless="${user.bannedUntil != null}">(назаўжды)</span>
                            </div>
                            <div class="text-sm text-muted"
                                th:text="'Зарэгістраваны: ' + ${#temporals.format(user.createdAt, 'dd.MM.yyyy')}"></div>
                        </div>

                        <div class="mod-item__modal-content">
                            <h3>Папярэджанне карыстальніка</h3>
                            <form th:action="@{/mod/users/{id}/warn(id=${user.id})}" method="post">
                                <div class="form-group">
                                    <label>Прычына</label>
                                    <input type="text" name="reason" class="form-input" placeholder="Прычына папярэджання" required>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn--outline" onclick="closeModPreview()">Адмяніць</button>
                                    <button type="submit" class="btn btn--primary">Адправіць</button>
                                </div>
                            </form>
                        </div>

                        <div class="mod-item__actions" th:if="${user.id != currentUser.id}">
                            <button type="button" class="btn btn--outline btn--icon" title="Папярэджанне" onclick="openModDialog(this, '.mod-item__modal-content')">
                                <i data-lucide="alert-triangle"></i>
                            </button>


                            <button type="button" class="btn btn--danger btn--icon" title="Заблакаваць"
                                th:attr="data-userid=${user.id}, data-username=${user.username}"
                                onclick="openBanModal(this.dataset.userid, this.dataset.username)">
                                <i data-lucide="ban"></i>
                            </button>

                            <!-- Unban -->
                            <form th:if="${user.status == 'banned'}" th:action="@{/mod/users/{id}/unban(id=${user.id})}"
                                method="post">
                                <button type="submit" class="btn btn--outline btn--icon" title="Разблакаваць">
                                    <i data-lucide="check"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="pagination" th:if="${totalPages > 1}">
                    <a th:if="${currentPage > 0}" th:href="@{/mod/users(page=${currentPage - 1})}"
                        class="btn btn--outline">← Назад</a>
                    <span class="text-muted" th:text="${currentPage + 1} + ' / ' + ${totalPages}"></span>
                    <a th:if="${currentPage + 1 < totalPages}" th:href="@{/mod/users(page=${currentPage + 1})}"
                        class="btn btn--outline">Далей →</a>
                </div>
            </div>
        </div>

        <div id="banModal" class="modal" style="display:none;">
            <div class="modal__backdrop" onclick="closeBanModal()"></div>
            <div class="modal__box">
                <h3>Заблакаваць карыстальніка: <span id="banUsername"></span></h3>
                <form id="banForm" method="post">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="form-group">
                        <label>Тэрмін блакіроўкі (дні, пакіньце пустым для пастаяннай)</label>
                        <input type="number" name="durationDays" class="form-input" min="1" placeholder="напр. 7">
                    </div>
                    <div class="form-group">
                        <label>Прычына</label>
                        <input type="text" name="reason" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Нататка мадэратара (неабавязкова)</label>
                        <textarea name="note" class="form-input" rows="3"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn--outline" onclick="closeBanModal()">Адмяніць</button>
                        <button type="submit" class="btn btn--danger">Заблакаваць</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function submitWarn(id) {
                const reason = document.getElementById('warn-' + id).value.trim();
                if (!reason) return alert('Укажыце прычыну');
                document.getElementById('warn-val-' + id).value = reason;
                document.getElementById('warn-form-' + id).submit();
            }

            function openBanModal(id, username) {
                document.getElementById('banUsername').textContent = username;
                document.getElementById('banForm').action = '/mod/users/' + id + '/ban';
                document.getElementById('banModal').style.display = 'flex';
            }

            function closeBanModal() {
                document.getElementById('banModal').style.display = 'none';
            }
        </script>
    </main>
</body>

</html>
