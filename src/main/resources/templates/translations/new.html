<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Новы пераклад', ~{::main})}">

<body>
    <main>
        <div class="page-header">
            <h1>Новы пераклад</h1>
        </div>
        <form th:action="@{/translations/new}" th:object="${createTranslationRequest}" method="post"
            enctype="multipart/form-data" class="form-card">
            <section class="form-section">
                <h2>Інфармацыя пра гульню</h2>
                <div class="form-group">
                    <label for="gameTitle">Назва гульні</label>
                    <input type="text" id="gameTitle" th:field="*{gameTitle}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('gameTitle')}" th:errors="*{gameTitle}"></span>
                </div>
                <div class="form-group">
                    <label>Распрацоўшчык</label>
                    <input type="text" th:field="*{developer}" class="form-input" placeholder="напр. CD Projekt Red">
                </div>
                <div class="form-group">
                    <label for="releaseYear">Год выпуску</label>
                    <input type="number" id="releaseYear" th:field="*{releaseYear}" class="form-input"
                        placeholder="напр. 2024" min="1970" th:attr="max=${#dates.year(#dates.createNow()) + 5}">
                </div>
                <div class="form-group">
                    <label>Жанры</label>
                    <input id="genres" name="genres">
                </div>
                <div class="form-group">
                    <label>Апісанне</label>
                    <div
                        th:replace="~{fragments/editor :: richEditor('gameDescription', ${createTranslationRequest.gameDescription})}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Вокладка</label>
                    <img th:if="${game.coverUrl}" th:src="${game.coverUrl}" class="image-preview image-preview--cover">
                    <input type="file" name="gameCover" accept="image/*" class="form-input">
                </div>
                <div class="form-group ">
                    <label for="gameBackground">Фонавы відарыс</label>
                    <img th:if="${game.backgroundUrl}" th:src="${game.backgroundUrl}"
                        class="image-preview image-preview--background">
                    <input type="file" id="gameBackground" name="gameBackground" accept="image/*" class="form-input">
                </div>
            </section>
            <section class="form-section">
                <h2>Інфармацыя пра пераклад</h2>
                <div class="form-group">
                    <label for="title">Назва перакладу</label>
                    <input type="text" id="title" th:field="*{title}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                <div class="form-group">
                    <label>Апісанне перакладу</label>
                    <div
                        th:replace="~{fragments/editor :: richEditor('description', ${createTranslationRequest.description})}">
                    </div>
                </div>
                <input type="hidden" name="status" value="draft">
            </section>
            <div class="form-actions">
                <a th:href="@{/}" class="btn btn--outline">Адмяніць</a>
                <button type="submit" class="btn btn--primary">Стварыць</button>
            </div>
        </form>

        <script>
            // No existing game here — genres start empty
            const select = new TomSelect("#genres", {
                valueField: "name",
                labelField: "name",
                searchField: "name",
                create: true,
                createOnBlur: true,
                persist: false,
                load: function (query, callback) {
                    if (!query.length) return callback();
                    fetch("/api/genres/search?q=" + encodeURIComponent(query))
                        .then(res => res.json())
                        .then(callback)
                        .catch(() => callback());
                }
            });
        </script>
    </main>
</body>

</html>
