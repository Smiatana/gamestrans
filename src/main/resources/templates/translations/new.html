<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Новы пераклад', ~{::main})}">

<body>
    <main class="main-content">
        <header class="page-header">
            <h1>Новы пераклад</h1>
        </header>

        <form th:action="@{/translations/new}" th:object="${createTranslationRequest}" method="post"
            enctype="multipart/form-data" class="form-card" novalidate>
            <section class="form-section">
                <h2>Інфармацыя пра гульню</h2>
                <div class="form-group">
                    <label for="gameTitle">Назва гульні <span class="form-required">*</span></label>
                    <input type="text" id="gameTitle" th:field="*{gameTitle}" class="form-input" 
                        required placeholder="Увядзіце назву гульні" minlength="1" maxlength="255">
                    <span class="form-error" th:if="${#fields.hasErrors('gameTitle')}" th:errors="*{gameTitle}"></span>
                </div>
                <div class="form-group">
                    <label for="developer">Распрацоўшчык</label>
                    <input type="text" id="developer" th:field="*{developer}" class="form-input" 
                        placeholder="напр. CD Projekt Red" maxlength="255">
                </div>
                <div class="form-group">
                    <label for="releaseYear">Год выпуску</label>
                    <input type="number" id="releaseYear" th:field="*{releaseYear}" class="form-input"
                        placeholder="напр. 2024" min="1970" th:attr="max=${#dates.year(#dates.createNow()) + 5}">
                </div>
                <div class="form-group">
                    <label for="genres">Жанры</label>
                    <input id="genres" name="genres" class="form-input" placeholder="Пошук і добавленне жанраў">
                </div>
                <div class="form-group">
                    <label for="gameDescription">Апісанне</label>
                    <div
                        th:replace="~{fragments/editor :: richEditor('gameDescription', ${createTranslationRequest.gameDescription})}">
                    </div>
                </div>
                <div class="form-group">
                    <label for="gameCover">Вокладка</label>
                    <input type="file" id="gameCover" name="gameCover" accept="image/*" class="form-input" onchange="previewImage(this, 'coverPreview')">
                    <small class="text-muted">Формат: JPG, PNG або WebP</small>
                </div>
                <div class="form-group">
                    <label for="gameBackground">Фонавы відарыс</label>
                    <input type="file" id="gameBackground" name="gameBackground" accept="image/*" class="form-input" onchange="previewImage(this, 'bgPreview')">
                    <small class="text-muted">Формат: JPG, PNG або WebP</small>
                </div>
            </section>
            <section class="form-section">
                <h2>Інфармацыя пра пераклад</h2>
                <div class="form-group">
                    <label for="title">Назва перакладу <span class="form-required">*</span></label>
                    <input type="text" id="title" th:field="*{title}" class="form-input" 
                        required placeholder="Увядзіце назву перакладу" minlength="1" maxlength="255">
                    <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>
                <div class="form-group">
                    <label for="description">Апісанне перакладу</label>
                    <div
                        th:replace="~{fragments/editor :: richEditor('description', ${createTranslationRequest.description})}">
                    </div>
                </div>
                <input type="hidden" name="status" value="draft">
            </section>
            <div class="form-actions">
                <a th:href="@{/}" class="btn btn--outline">Адмяніць</a>
                <button type="submit" class="btn btn--primary">Стварыць</button>
            </div>
        </form>

        <script>
            // Image preview functionality
            function previewImage(input, previewId) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        let preview = document.getElementById(previewId);
                        if (!preview) {
                            preview = document.createElement('img');
                            preview.id = previewId;
                            preview.className = 'image-preview';
                            input.parentElement.insertBefore(preview, input);
                        }
                        preview.src = e.target.result;
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            }

            const select = new TomSelect("#genres", {
                valueField: "name",
                labelField: "name",
                searchField: "name",
                create: true,
                createOnBlur: true,
                persist: false,
                load: function (query, callback) {
                    if (!query.length) return callback();
                    fetch("/api/genres/search?q=" + encodeURIComponent(query))
                        .then(res => res.json())
                        .then(callback)
                        .catch(() => callback());
                }
            });
        </script>
    </main>
</body>

</html>
