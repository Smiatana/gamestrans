<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Дадаць пераклад', ~{::main})}">

<body>
    <main>
        <div class="page-header">
            <h1>Дадаць пераклад да <a th:href="@{/g/{title}(title=${game.title})}" th:text="${game.title}"></a></h1>
        </div>

        <form th:action="@{/g/{title}/t/add(title=${game.title})}" th:object="${addTranslationRequest}" method="post"
            enctype="multipart/form-data" class="form-card">
            <section class="form-section">
                <section class="form-section">
                    <h2>Інфармацыя пра пераклад</h2>

                    <div class="form-group">
                        <label for="title">Назва перакладу</label>
                        <input type="text" id="title" th:field="*{title}" class="form-input">
                        <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                    </div>

                    <div class="form-group">
                        <label for="description">Апісанне перакладу</label>
                        <textarea id="description" th:field="*{description}"
                            class="form-input form-textarea"></textarea>
                    </div>
                </section>

                <div class="form-actions">
                    <a th:href="@{/}" class="btn btn--outline">Адмяніць</a>
                    <button type="submit" class="btn btn--primary">Стварыць</button>
                </div>

        </form>
    </main>
</body>

</html>
