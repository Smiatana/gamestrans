<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Пераклад', ~{::main})}">

<body>
    <main>
        <div th:if="${translation}">
            <div class="page-header">
                <div>
                    <a th:href="@{/g/{g}(g=${translation.game.title})}">
                        <p class="text-muted" th:text="${translation.game.title}"></p>
                    </a>
                    <h1 th:text="${translation.title}"></h1>
                </div>
                <div class="page-header__actions">
                    <a th:href="@{/g/{g}/t/{t}/issues(g=${translation.game.title},t=${translation.title})}"
                        class="btn btn--outline">Праблемы</a>
                    <a th:if="${isOwner}"
                        th:href="@{/g/{title}/t/{tid}/edit(title=${translation.game.title}, tid=${translation.title})}"
                        class="btn btn--outline">Рэдагаваць</a>
                    <div th:replace="~{fragments/report :: button('translation', ${translation.id})}"></div>
                </div>
            </div>

            <div class="content-grid">
                <div class="content-main">
                    <div class="card">
                        <div class="card__header" style="flex-direction:column; align-items:flex-start; gap:0.5rem;">
                            <div class="text" th:utext="${translation.description}"></div>
                            <span class="badge" th:classappend="'badge--' + ${translation.status}">
                                <th:block th:switch="${translation.status}">
                                    <th:block th:case="'draft'">Чарнавік</th:block>
                                    <th:block th:case="'in_progress'">У распрацоўцы</th:block>
                                    <th:block th:case="'completed'">Завершаны</th:block>
                                    <th:block th:case="*" th:text="${translation.status}"></th:block>
                                </th:block>
                            </span>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card__header">
                            <h2>Рэлізы</h2>
                            <a th:if="${isOwner || isMember}"
                                th:href="@{/releases/new(translationId=${translation.id})}"
                                class="btn btn--primary">Новы рэліз</a>
                        </div>
                        <div th:if="${#lists.isEmpty(releases)}" class="text-muted">
                            <p>Рэлізаў пакуль няма</p>
                        </div>
                        <div class="release-list" th:unless="${#lists.isEmpty(releases)}">
                            <a th:each="release : ${releases}"
                                th:href="@{/g/{g}/t/{t}/r/{r}(g=${translation.game.title}, t=${translation.title}, r=${release.title})}"
                                class="release-item"
                                th:classappend="${release.status == 'draft' or release.status == 'on_review'} ? ' release-item--draft' : ''">
                                <div class="release-item__info">
                                    <span class="release-item__title" th:text="${release.title}"></span>
                                    <span th:if="${release.status == 'on_review'}" class="badge badge--review">На
                                        разглядзе</span>
                                    <span class="text-muted text-sm"
                                        th:text="${#temporals.format(release.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                                </div>
                                <span class="release-item__arrow">→</span>
                            </a>
                        </div>
                        <div th:if="${hasMoreReleases}" class="card__footer">
                            <a th:href="@{/g/{g}/t/{t}/r(g=${translation.game.title}, t=${translation.title})}"
                                class="btn btn--outline btn--sm">Усе рэлізы</a>
                        </div>
                    </div>
                </div>

                <div class="content-sidebar">
                    <div class="card">
                        <h2>Удзельнікі</h2>
                        <ul class="member-list">
                            <li th:each="member : ${members}" class="member-item">
                                <a th:text="${member.user.username}" th:href="@{/u/{u}(u=${member.user.username})}"></a>
                                <span class="badge" th:text="${member.role}"></span>
                            </li>
                        </ul>
                    </div>

                    <div class="card">
                        <h2>Ацэнка</h2>
                        <div th:if="${avgRating != null}">
                            <span class="rating-stars" th:text="${avgRating} + ' ★'"></span>
                            <span class="text-muted text-sm" th:text="'(' + ${ratingCount} + ' ацэн.)'"></span>
                        </div>
                        <p th:unless="${avgRating != null}" class="text-muted">Ацэнак пакуль няма</p>
                        <div th:if="${currentUser != null and !isMember and !isOwner}">
                            <form th:action="@{/g/{g}/t/{t}/rating(g=${translation.game.title},t=${translation.title})}"
                                method="post" class="rating-form">
                                <div class="star-picker">
                                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                        <button type="submit" name="stars" th:value="${i}" class="star-btn"
                                            th:classappend="${userRating != null and userRating.stars >= i} ? ' star-btn--active' : ''">★</button>
                                    </th:block>
                                </div>
                            </form>
                            <form th:if="${userRating != null}"
                                th:action="@{/g/{g}/t/{t}/rating(g=${translation.game.title},t=${translation.title})}"
                                method="post">
                                <input type="hidden" name="_method" value="DELETE">
                                <button type="submit" class="btn btn--outline btn--sm">Выдаліць ацэнку</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div
                    th:replace="~{fragments/comments :: section(${translation}, ${currentUser}, ${rootComments}, ${replies}, ${commentRequest}, ${isMember})}">
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/report :: modal}"></div>
    </main>
</body>

</html>
