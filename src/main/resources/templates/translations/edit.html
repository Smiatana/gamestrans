<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Рэдагаванне перакладу', ~{::main})}">

<body>
    <main>
        <div class="page-header">
            <h1>Рэдагаванне перакладу</h1>
        </div>

        <form th:action="@{/games/{title}/{id}/edit(title=${game.title}, id=${translation.title})}"
            th:object="${createTranslationRequest}" method="post" enctype="multipart/form-data" class="form-card">

            <section class="form-section">
                <h2>Інфармацыя пра гульню</h2>

                <div class="form-group">
                    <label for="gameTitle">Назва гульні</label>
                    <input type="text" id="gameTitle" th:field="*{gameTitle}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('gameTitle')}" th:errors="*{gameTitle}"></span>
                </div>

                <div class="form-group">
                    <label for="gameDescription">Апісанне гульні</label>
                    <textarea id="gameDescription" th:field="*{gameDescription}"
                        class="form-input form-textarea"></textarea>
                </div>

                <div class="form-group">
                    <label for="gameCover">Вокладка</label>
                    <img th:if="${translation.game.coverUrl}" th:src="${translation.game.coverUrl}"
                        class="cover-preview">
                    <input type="file" id="gameCover" name="gameCover" accept="image/*" class="form-input">
                </div>
            </section>

            <section class="form-section">
                <h2>Інфармацыя пра пераклад</h2>

                <div class="form-group">
                    <label for="description">Апісанне перакладу</label>
                    <textarea id="description" th:field="*{description}" class="form-input form-textarea"></textarea>
                </div>
            </section>

            <div class="form-actions">
                <a th:href="@{/translations/{id}(id=${translation.title})}" class="btn btn--outline">Адмяніць</a>
                <button type="submit" class="btn btn--primary">Захаваць</button>
            </div>
        </form>

        <div class="danger-zone">
            <h2>Небяспечная зона</h2>
            <p class="text-muted">Выдаленне перакладу немагчыма адмяніць</p>
            <form th:action="@{/games/{title}/{id}/delete(title=${game.title}, id=${translation.title})}" method="post">
                <button type="submit" class="btn btn--danger" onclick="return confirm('Вы ўпэўнены?')">Выдаліць
                    пераклад</button>
            </form>
        </div>

    </main>
</body>

</html>
