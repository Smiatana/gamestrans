<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: html('Рэдагаванне перакладу', ~{::main})}">

<head>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body>
    <main>
        <div class="page-header">
            <h1>Рэдагаванне перакладу гульні <a th:href="@{/g/{g}(g=${translation.game.title})}"></a></h1>
        </div>

        <form th:action="@{/g/{title}/t/{id}/edit(title=${translation.game.title}, id=${translation.title})}"
            th:object="${addTranslationRequest}" method="post" enctype="multipart/form-data" class="form-card">
            <input type="hidden" name="_method" value="patch" />
            <section class="form-section">
                <h2>Інфармацыя пра пераклад</h2>

                <div class="form-group">
                    <label for="title">Назва перакладу</label>
                    <input type="text" id="title" th:field="*{title}" class="form-input">
                    <span class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

                </div>
                <div class="form-group">
                    <label for="description">Апісанне перакладу</label>
                    <div id="description"
                        th:replace="~{fragments/editor :: richEditor('description', ${translation.description})}">
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-group">
                        <label>Статус перакладу</label>
                        <select th:field="*{status}" class="form-input">
                            <option value="draft">Чарнавік</option>
                            <option value="in_progress">У распрацоўцы</option>
                            <option value="completed">Завершаны</option>
                        </select>
                        <span class="form-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <a th:href="@{/g/{title}/t/{id}(title=${translation.game.title}, id=${translation.title})}"
                    class="btn btn--outline">Адмяніць</a>
                <button type="submit" class="btn btn--primary">Захаваць</button>
            </div>
        </form>

        <section class="form-section" th:if="${isOwner}">
            <h2>Удзельнікі</h2>
            <ul class="member-list">
                <li th:each="member : ${members}" class="member-item">
                    <a th:href="@{/u/{u}(u=${member.user.username})}" th:text="${member.user.username}"></a>
                    <span class="badge" th:text="${member.role}"></span>
                    <form th:if="${member.role != 'owner'}"
                        th:action="@{/g/{g}/{t}/members/kick/{u}(g=${translation.game.title}, t=${translation.title}, u=${member.user.username})}"
                        method="post" style="display:inline;">
                        <button class="btn btn--danger btn--sm"
                            onclick="return confirm('Выключыць удзельніка?')">Выключыць</button>
                    </form>
                </li>
            </ul>

            <h3>Запрасіць удзельніка</h3>
            <div class="form-group">
                <input type="text" id="userSearch" class="form-input" placeholder="Пошук па імені...">
                <div id="searchResults" class="search-results"></div>
            </div>

            <script th:inline="javascript">
                const searchInput = document.getElementById('userSearch');
                const searchResults = document.getElementById('searchResults');
                const gameTitle = /*[[${translation.game.title}]]*/ "";
                const transTitle = /*[[${translation.title}]]*/ "";

                const csrf = document.querySelector('meta[name="_csrf"]').content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;


                function invite(username) {
                    const url = `/g/${encodeURIComponent(gameTitle)}/${encodeURIComponent(transTitle)}/members/invite/${username}`;
                    fetch(url, {
                        method: 'POST',
                        headers: { [csrfHeader]: csrf }
                    }).then(res => {
                        if (res.ok) {
                            alert('Запрашэнне адпраўлена');
                        } else {
                            res.text().then(msg => alert(msg));
                        }
                    });
                }

                let timeout;
                searchInput.addEventListener('input', function () {
                    clearTimeout(timeout);
                    const q = this.value.trim();
                    if (q.length < 2) { searchResults.innerHTML = ''; return; }
                    timeout = setTimeout(() => {
                        fetch('/users/search?q=' + encodeURIComponent(q))
                            .then(r => r.json())
                            .then(users => {
                                searchResults.innerHTML = users.map(u => `
                                    <div class="search-result-item">
                                        <img src="${u.avatarUrl || ''}" class="search-result-item__avatar">
                                        <a href="/u/${u.username}">${u.username}</a>
                                        <button class="btn btn--primary btn--sm" 
                                                onclick="invite('${u.username}')">Запрасіць</button>
                                    </div>
                                `).join('');
                            });
                    }, 300);
                });
            </script>
        </section>

        <div class="danger-zone">
            <h2>Небяспечная зона</h2>
            <p class="text-muted">Выдаленне перакладу немагчыма адмяніць</p>
            <form th:action="@{/g/{title}/t/{id}/delete(title=${translation.game.title}, id=${translation.title})}"
                method="post">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" class="btn btn--danger" onclick="return confirm('Вы ўпэўнены?')">Выдаліць
                    пераклад</button>
            </form>
        </div>

    </main>
</body>

</html>
